<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthleteTrainLab · Perfil del deportista</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --acc:#2dd4bf; --acc2:#0ea5e9; --txt:#e6edf3; --dim:#8b949e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: radial-gradient(1200px 600px at 70% -10%, #12303a 0%, var(--bg) 55%);
    color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .app { width:100%; max-width:560px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 28px; animation:in .35s ease; }
  @keyframes in { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }
  .logo { text-align:center; margin-bottom:16px; }
  .logo img { width:70%; max-width:220px; height:auto; border-radius:10px; }
  .fase { color:var(--acc); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
  h1 { font-size:23px; line-height:1.3; margin-bottom:10px; }
  h2 { font-size:19px; line-height:1.35; margin-bottom:8px; font-weight:600; }
  p.sub { color:var(--dim); font-size:15px; line-height:1.55; margin-bottom:20px; }
  input[type=text], input[type=email], textarea { width:100%; background:#1c2129; border:1px solid var(--border); color:var(--txt);
    padding:13px 15px; border-radius:10px; font-size:16px; margin-bottom:12px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt { text-align:left; background:#1c2129; border:1px solid var(--border); color:var(--txt);
    padding:14px 16px; border-radius:10px; font-size:15.5px; cursor:pointer; transition:all .15s; }
  .opt:hover { border-color:var(--acc); background:#20303280; }
  .opt.sel { border-color:var(--acc); background:#12403a; }
  .sino { display:flex; gap:12px; }
  .sino .opt { flex:1; text-align:center; font-weight:700; }
  .btn { display:inline-block; background:linear-gradient(90deg,var(--acc2),var(--acc)); color:#04252b;
    font-weight:700; border:none; padding:14px 30px; border-radius:10px; font-size:16px; cursor:pointer; width:100%; margin-top:6px; }
  .link { background:none; border:none; color:var(--acc); cursor:pointer; font-size:14px; margin-top:12px; text-decoration:underline; }
  .disclaimer { color:var(--dim); font-size:12px; margin-top:14px; line-height:1.5; }
  .prog { height:4px; background:var(--border); border-radius:2px; margin-bottom:22px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--acc2),var(--acc)); transition:width .4s ease; }
  .escala-val { text-align:center; font-size:44px; font-weight:800; color:var(--acc); line-height:1; margin:6px 0 2px; }
  input[type=range] { width:100%; margin:14px 0 4px; accent-color:var(--acc); height:6px; }
  .escala-labels { display:flex; justify-content:space-between; color:var(--dim); font-size:12.5px; margin-bottom:6px; }
  .gauges { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 4px; }
  .gauge { background:#12161d; border:1px solid var(--border); border-radius:12px; padding:8px 6px 4px; text-align:center; }
  .gauge.gen { grid-column:1 / -1; background:#0f2a25; border-color:#1f4a41; }
  .gauge-lbl { font-size:12px; color:var(--dim); margin-top:-6px; }
  .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .notas { background:#12161d; border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:12px; }
  .notas h3 { font-size:13px; color:var(--acc); margin-bottom:6px; }
  .notas div { font-size:13px; color:var(--dim); margin:4px 0; }
  select { background:#1c2129; color:var(--txt); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; }
</style>
</head>

// condicionales (dependen de respuestas previas)
INTERVIEWS.seguimiento_semanal.preguntas.find(q=>q.id==="dif").showIf     = r => r.cumplio==="NO";

INTERVIEWS.seguimiento_semanal.preguntas.find(q=>q.id==="dolor_post").showIf = r => r.dolor_tipo==="puntual";

INTERVIEWS.seguimiento_semanal.preguntas.find(q=>q.id==="fondo_por").showIf  = r => r.fondo!=null && Number(r.fondo)<5;

const TIPO_NOMBRES = {inicial:"Entrevista inicial",nutricion:"Nutrición",tecnica_ruta:"Técnica ruta",tecnica_mtb:"Técnica MTB",flexibilidad_fuerza:"Flexibilidad y fuerza",seguimiento_semanal:"Seguimiento semanal",estres_descanso:"Estrés y descanso",post_evento:"Post-evento"};

const params = new URLSearchParams(location.search);
let tipo = params.get("tipo"); if(!INTERVIEWS[tipo]) tipo="inicial";
const ATL_ID = params.get("atl_id") || null;
const ctx = { atl_id:ATL_ID, tipo, respuestas:{}, nombre:null, email:null };
let orden = [];

const $ = h => { document.getElementById("card").innerHTML = h; };
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function flags(){ const f={}; INTERVIEWS[tipo].preguntas.forEach(q=>{ if(q.tipo==="multi"){ const a=ctx.respuestas[q.id]; if(a) q.op.forEach(o=>{ if(a[o.flag]) f[o.flag]=true; }); } }); return f; }
function activas(){ const fl=flags(); return INTERVIEWS[tipo].preguntas.filter(q => (!q.si || fl[q.si]) && (!q.showIf || q.showIf(ctx.respuestas))); }
function siguiente(){ for(const q of activas()){ if(ctx.respuestas[q.id]===undefined) return q; } return null; }
function prog(){ const act=activas(); const rest=act.filter(q=>ctx.respuestas[q.id]===undefined).length; const done=act.length-rest; document.getElementById("pf").style.width=Math.min(100,(done/(done+rest+0.001))*100)+"%"; }

function bienvenida(){
  document.getElementById("pf").style.width="0%";
  const iv = INTERVIEWS[tipo];
  const ident = ATL_ID
    ? `<p class="meta">Cliente ATL: <b>${esc(ATL_ID)}</b></p>`
    : `<input type="text" id="nombre" placeholder="Nombre del deportista (opcional)"><input type="email" id="email" placeholder="Correo (opcional)">`;
  const sel = Object.keys(INTERVIEWS).map(k=>`<option value="${k}" ${k===tipo?"selected":""}>${TIPO_NOMBRES[k]}</option>`).join("");
  $(`<div class="logo"><img src="../knowledge/img/ATLLogoColor.jpg" alt="AthleteTrainLab"></div>
    <div class="fase">Perfil del deportista</div>
    <h1>${esc(iv.titulo)}</h1>
    <p class="sub">${esc(iv.intro)}</p>
    ${ident}
    <button class="btn" onclick="empezar()">Comenzar</button>
    <div style="margin-top:16px" class="disclaimer">Tipo (para pruebas): <select onchange="cambiarTipo(this.value)">${sel}</select></div>`);
}
function cambiarTipo(t){ tipo=t; ctx.tipo=t; ctx.respuestas={}; orden=[]; bienvenida(); }
function empezar(){
  if(!ATL_ID){ const n=document.getElementById("nombre"),em=document.getElementById("email"); ctx.nombre=(n&&n.value.trim())||null; ctx.email=(em&&em.value.trim())||null; }
  pregunta();
}

function pregunta(){
  const q = siguiente();
  if(!q) return resultado();
  prog();
  const back = orden.length ? '<button class="link" onclick="atras()">Atrás</button>' : '';
  if(q.tipo==="escala"){
    const val = ctx.respuestas[q.id] ?? 5;
    $(`<div class="fase">Perfil · ${esc(TIPO_NOMBRES[tipo])}</div><h2>${esc(q.t)}</h2>
      <div class="escala-val" id="ev">${val}</div>
      <input type="range" min="1" max="10" step="1" value="${val}" id="rg" oninput="document.getElementById('ev').textContent=this.value">
      <div class="escala-labels"><span>${esc(q.min)}</span><span>${esc(q.max)}</span></div>
      <button class="btn" onclick="responder('${q.id}',Number(document.getElementById('rg').value))">Continuar</button>${back}`);
  } else if(q.tipo==="opcion"){
    const cls = q.sino ? "opts sino" : "opts";
    $(`<div class="fase">Perfil · ${esc(TIPO_NOMBRES[tipo])}</div><h2>${esc(q.t)}</h2>
      <div class="${cls}">${q.op.map(o=>`<button class="opt" onclick="responder('${q.id}','${o.key}')">${esc(o.t)}</button>`).join("")}</div>${back}`);
  } else if(q.tipo==="texto"){
    $(`<div class="fase">Perfil · ${esc(TIPO_NOMBRES[tipo])}</div><h2>${esc(q.t)}</h2>
      <textarea id="tx" placeholder="Escribí aquí...">${esc(ctx.respuestas[q.id]||"")}</textarea>
      <button class="btn" onclick="responder('${q.id}',(document.getElementById('tx').value||'').trim())">Continuar</button>${back}`);
  } else { // multi
    const cur = ctx.respuestas[q.id] || {};
    $(`<div class="fase">Perfil · ${esc(TIPO_NOMBRES[tipo])}</div><h2>${esc(q.t)}</h2>
      <div class="opts">${q.op.map((o,i)=>`<button class="opt ${cur[o.flag]?'sel':''}" id="m${i}" onclick="toggleMulti('${q.id}',${i})">${esc(o.t)}</button>`).join("")}</div>
      <button class="btn" onclick="responder('${q.id}',ctx.respuestas['${q.id}']||{})">Continuar</button>${back}`);
  }
}
function responder(id,val){ ctx.respuestas[id]=val; orden.push(id); pregunta(); }
function toggleMulti(id,i){
  const q=INTERVIEWS[tipo].preguntas.find(x=>x.id===id); const o=q.op[i]; const cur=ctx.respuestas[id]||{};
  cur[o.flag]=!cur[o.flag]; ctx.respuestas[id]=cur;
  document.getElementById("m"+i).classList.toggle("sel");
}
function atras(){ const id=orden.pop(); if(id!==undefined){ delete ctx.respuestas[id]; pregunta(); } }

function calcularScores(){
  const acc={};
  activas().forEach(q=>{
    const r=ctx.respuestas[q.id]; if(r==null||r==="") return;
    if(q.tipo==="escala" && q.score){ (acc[q.score]=acc[q.score]||[]).push(Number(r)); }
    else if(q.tipo==="opcion" && q.score){ const o=q.op.find(x=>x.key===r); if(o&&o.v!=null)(acc[q.score]=acc[q.score]||[]).push(o.v); }
  });
  const scores={};
  for(const s in acc){ const a=acc[s]; scores[s]=Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10; }
  // generales derivados = promedio de subscores presentes
  for(const g of GENERALES){ const subs=DERIV[g].filter(k=>scores[k]!=null); if(subs.length){ scores[g]=Math.round(subs.reduce((x,k)=>x+scores[k],0)/subs.length*10)/10; } }
  return scores;
}

function polar(cx,cy,r,deg){ const a=Math.PI*deg/180; return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
function arcPath(cx,cy,r,d1,d2){ const [x1,y1]=polar(cx,cy,r,d1),[x2,y2]=polar(cx,cy,r,d2); const large=Math.abs(d2-d1)>180?1:0; const sweep=d1>d2?1:0; return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} ${sweep} ${x2.toFixed(1)} ${y2.toFixed(1)}`; }
function color(v){ return v<4?"#e0457b":(v<7?"#e7c13c":"#4fa96e"); }
function gauge(v,label,gen){
  const ang = 180 - (v/10)*180; const [nx,ny]=polar(100,100,66,ang);
  return `<div class="gauge ${gen?'gen':''}"><svg viewBox="0 0 200 116" width="${gen?'55%':'100%'}">
    <path d="${arcPath(100,100,80,180,0)}" fill="none" stroke="#2a3038" stroke-width="14" stroke-linecap="round"/>
    <path d="${arcPath(100,100,80,180,ang)}" fill="none" stroke="${color(v)}" stroke-width="14" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#e6edf3" stroke-width="3"/>
    <circle cx="100" cy="100" r="5" fill="#e6edf3"/>
    <text x="100" y="90" text-anchor="middle" fill="${color(v)}" font-size="30" font-weight="800" font-family="Arial">${v}</text>
  </svg><div class="gauge-lbl">${esc(label)}</div></div>`;
}

function resultado(){
  document.getElementById("pf").style.width="100%";
  const scores = calcularScores(); ctx.scores = scores;
  guardar();
  const claves = ORDEN.filter(k=>scores[k]!=null).concat(Object.keys(scores).filter(k=>!ORDEN.includes(k)));
  const gauges = claves.length ? `<div class="gauges">${claves.map(s=>gauge(scores[s], SCORE_LABELS[s]||s, GENERALES.includes(s))).join("")}</div>` : `<p class="sub">Sin scores.</p>`;
  // notas: respuestas capturadas (opción sin score y textos)
  let notas="";
  activas().forEach(q=>{
    const r=ctx.respuestas[q.id]; if(r==null||r==="") return;
    if(q.tipo==="texto"){ notas+=`<div><b>${esc(q.t)}:</b> ${esc(r)}</div>`; }
    else if(q.tipo==="opcion" && !q.score){ const o=q.op.find(x=>x.key===r); notas+=`<div><b>${esc(q.t)}:</b> ${esc(o?o.t:r)}</div>`; }
    else if(q.tipo==="opcion" && q.sino && (q.id.indexOf("dolor")===0)){ const o=q.op.find(x=>x.key===r); notas+=`<div><b>${esc(q.t)}:</b> ${esc(o?o.t:r)}</div>`; }
  });
  const notasBlock = notas ? `<div class="notas"><h3>Notas para el entrenador</h3>${notas}</div>` : "";
  const disc = Object.keys(flags()).filter(f=>flags()[f]);
  $(`<div class="fase">Perfil · ${esc(TIPO_NOMBRES[tipo])}</div>
    <h2>${ctx.nombre?esc(ctx.nombre)+", ":""}este es tu perfil</h2>
    <p class="meta">${ATL_ID?"Cliente ATL: <b>"+esc(ATL_ID)+"</b>":""}${disc.length?(ATL_ID?" · ":"")+"Disciplinas: "+disc.join(", "):""}</p>
    ${gauges}${notasBlock}
    <p class="disclaimer">Cada tacómetro es un score de 0 a 10 según tus respuestas. Los generales son el promedio de sus subáreas. Guardamos este perfil para tu seguimiento con AthleteTrainLab.</p>
    <div style="margin-top:14px;text-align:center"><a class="btn" style="text-decoration:none;display:inline-block;width:auto;padding:12px 24px" href="${WA}" target="_blank" rel="noopener">Hablar con tu entrenador</a></div>`);
}

function guardar(){
  try{
    fetch(SB_URL+"/rest/v1/perfil_evaluaciones",{method:"POST",
      headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,Prefer:"return=minimal"},
      body:JSON.stringify({atl_id:ctx.atl_id,tipo:ctx.tipo,nombre:ctx.nombre,email:ctx.email,
        scores:ctx.scores||null,flags:flags(),respuestas:ctx.respuestas||null,user_agent:navigator.userAgent})
    }).catch(()=>{});
  }catch(e){}
}
bienvenida();
</script>
